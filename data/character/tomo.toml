Description="""
Tomo uses his tome to summon a large wall of magic covering a wide area in front of him.
<br><br>
This move serves as both a good spacing tool and an even better anti-zoning tool, reflecting any incoming projectiles
back from whence they came. Being a command normal, this move can be canceled into any of Tomo's powerful special
moves or supers. Additionally, this move can be canceled into itself on hit for easy extra damage in the corner.
<br><br>
Overall, its low Mana cost and wide array of follow-up options being available both on block and on hit solidifies this
move as a reliable option as a non-committal 'get-off-me' tool whenever Tomo is low on Mana or needs to escape a less
than favorable position.
"""
