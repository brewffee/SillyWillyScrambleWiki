Tomo stands in place and recovers his Mana gauge.
<ul>
    <li>%auto(P) <b>Renovare</b> recovers mana with no cost, but at a slow speed. Is very easily counterhit, so Tomo
    should be very careful when using it. This version is almost always overshadowed by %auto(22K) unless
    Tomo has secured a safe position to use it in, such as after sucessfully landing a %ref(Trinity: Apprehendere).</li>
    <li>%auto(K) <b>Renovare</b> recovers mana quickly at the cost of meter. This version is much safer to use in
    neutral, but is still requires a similar caution to its %auto(P) counterpart, as Tomo will gradually lose
    more meter over time.</li>
