[Character]
Name="Tomo"
Description="""
%banner(warning, "This page is currently undergoing a complete rewrite. Information here may be incorrect or outdated.")
Wielding a glaive and tome, Tomo is a master of the midrange who uses his resources to control the ebb and flow
of battle.
<br><br>
Tomo is entirely defined by his unique resource, %ref(Mana,Mana,_). Tomo uses a portion of his Mana to cast
any of his special moves (including %ref(6S)). If a move costs more Mana than he currently has, it will not
trigger and instead will whiff. If his Mana is depleted, he will enter %ref(Exhaustion,Exhaustion,_)—a
debilitating state that leaves him highly vulnerable to massive damage.
<br><br>
Once he is at a safe range, Tomo can use his specials to expertly control the midrange, forcing the opponent to
think twice about their approach. With the right momentum, he can easily keep up a solid web of denial; once
his opponent is caught, Tomo is free to close in for a full combo combined with the choice of %note(When your opponent
is knocked down and you are able to attack them as soon as they wake up,okizeme) or resource recovery. When he has
%ref(Mana Crimen) and 50% meter on his side, Tomo can skip this choice altogether and opt for a much
longer and more effective pressure sequence which at worst leaves him at neutral odds with the opponent.
<br><br>
Tomo's kit gives him the freedom to decide how the game unfolds, provided he has the resources to do so. In the
right hands, Tomo is a highly versatile and cerebral fighter who rewards patience, precision, and execution.
"""
IconPath="icon/Tomo_Icon.png"
PortraitPath="portrait/Tomo_Portrait.png"
AlternatePortraitPath="portrait/Tomo_Alternate_Portrait.png"
AlternateNote="Kareru Crevan"
Type="Magic"
Health="575"
MoveSpeed="0.85x"
Stage="%refStage(The Library)"
Reversals=[
    "%ref(Trinity Overdrive: Libertas,2141236H)",
]

###################################
# Unique Mechanics
###################################
[[Character.Mechanics]] # Trinity
Name="Trinity"
Type="Text"
Description="""
Whenever Tomo performs a special move (with the exception of %ref(Renovare)), he uses his Mana to command his partner
Trinity to attack the opponent. Trinity can act semi-independently of Tomo, allowing him to move freely and act while
his partner is busy. After Trinity attacks an opponent, he stays in place for a short duration, allowing Tomo to command
another attack from further distances.
<br><br>
If Tomo blocks an opponent's attack while Trinity is summoned, Trinity will move to Tomo's side and block alongside him,
increasing the pushback on block and negating any chip damage. However, if Tomo or Trinity are hit, Trinity will
cancel his current action and disappear, requiring Tomo to regain distance and summon him again.
%img(Tomo_Trinity.png,Trinity,"Trinity",320)
"""

[[Character.Mechanics]] # Mana
Name="Mana"
Type="Text"
Description="""
Mana is a resource that Tomo depends on to perform his specials. Whenever Trinity is interrupted by an attack, Tomo
loses Mana proportionate to the damage dealt. He cannot use moves that cost more mana than he has, requiring him to
always stay on top of his resources. If he is to lose all of his Mana, he enters %ref(Exhaustion,Exhaustion,_).
%img(Tomo_Mana_Meters.png,Mana Meters,"Mana meter when full (left), compared to Mana meter when in Exhaustion
(right)")
"""

[[Character.Mechanics]] # Exhaustion
Name="Exhaustion"
Type="Text"
Description="""
When Tomo's Mana is fully depleted, any action he is currently performing is canceled as he steps back to catch his
breath, automatically entering the Exhaustion state. During this state, Tomo is left <b>helpless and vulnerable</b>,
as he takes double damage when hit, and cannot summon his partner to cover his weak spots. Additionally, he cannot
recover mana through %ref(Renovare) or %ref(Mana Crimen), instead being forced to wait for his resource to slowly
auto-regenerate.
"""

