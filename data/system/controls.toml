[[System.Controls]]
Type="Text"
Name="Button Layout"
Description="""
Silly Willy Scramble uses a simple control scheme with 5 buttons and several utility macros to perform a variety of
actions. The names of these buttons take inspiration from the Guilty Gear series.
<br>
<ul>
    <li>%auto(P) - <b>Punch</b> <br> Your lightest normal attack button. Typically useful to get out of pressure with
    low commitment, or stopping the opponent's approach with the universal %auto(6P) anti-air.</li> <br>
    <li>%auto(K) - <b>Kick</b> <br> Your second lightest normal button. This button is sometimes linked to motion inputs
    that deal with special movement options.</li> <br>
    <li>%auto(S) - <b>Slash</b> <br> In neutral situations, your best button for a balance of power and versatility.
    </li> <br>
    <li>%auto(H) - <b>Heavy Slash</b> <br> In most cases, your most powerful button. Will usually come at a cost of
    being sluggish or high commitment, but the rewards are well worth it when used correctly.</li> <br>
    <li>%auto(G) - <b>Gaming</b> <br> Universal overhead, sweep, and throw button. Extremely useful for quickly opening
    up the opponent, but suffers from a lack of consistent high reward when used.</li>
</ul>
"""

[[System.Controls]]
Type="Text"
Name="Macros"
Description="""
Besides the traditional inputs, certain actions can also be performed using pre-defined macros.
<br>
<ul>
    <li><b>Dash</b> <br> Allows you to run up or dash without having to manually press %btn("66",x), and enables you to
    input other directions or motions significantly easier, as the 6 direction is not occupied when using the macro.
    Backdash can be performed by inputting 4+Dash Macro, although it cannot be held.</li> <br>
    <li><b>Burst</b> <br> Performs a Burst at the press of a button. </li> <br>
    <li><b>Scramble Cancel</b> <br> One button Scramble Cancel macro, useful for performing actions quickly out
    of a Scramble Cancel.</li> <br>
    <li><b>Taunt</b> <br> Taunt lacks a proper dedicated input, requiring usage of the macro to perform.</li>
</ul>
"""

